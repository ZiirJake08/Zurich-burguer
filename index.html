<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zurich Burguer | Toma de encargos</title>
<style>
  :root {
    --rojo: #c8102e;
    --rojo-oscuro: #9b0c23;
    --amarillo: #ffc72c;
    --crema: #fff8ec;
    --carbon: #231f20;
    --gris: #6b6465;
    --borde: #eadfcb;
    --blanco: #ffffff;
    --verde: #1f8a4c;
    --radio: 14px;
    --sombra: 0 6px 18px rgba(35, 31, 32, .10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--crema);
    color: var(--carbon);
    line-height: 1.45;
  }
  button { font-family: inherit; cursor: pointer; }
  img { max-width: 100%; }

  /* ---------- Encabezado ---------- */
  header {
    background: linear-gradient(135deg, var(--rojo) 0%, var(--rojo-oscuro) 100%);
    color: var(--blanco);
    padding: 28px 16px 24px;
    text-align: center;
    border-bottom: 6px solid var(--amarillo);
  }
  .logo { font-size: 46px; line-height: 1; }
  header h1 {
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 6px;
  }
  header h1 span { color: var(--amarillo); }
  header p { opacity: .92; margin-top: 4px; font-size: 15px; }

  /* ---------- Layout ---------- */
  .contenedor {
    max-width: 1150px;
    margin: 0 auto;
    padding: 20px 14px 110px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
  }
  @media (min-width: 900px) {
    .contenedor { grid-template-columns: 1.5fr 1fr; padding-bottom: 40px; align-items: start; }
    .barra-movil { display: none !important; }
    #panel-pedido { position: sticky; top: 14px; }
  }

  /* ---------- Menú ---------- */
  .categorias {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 14px;
    scrollbar-width: thin;
  }
  .cat-btn {
    flex: 0 0 auto;
    border: 2px solid var(--borde);
    background: var(--blanco);
    color: var(--carbon);
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    transition: .15s;
  }
  .cat-btn:hover { border-color: var(--rojo); }
  .cat-btn.activa { background: var(--rojo); border-color: var(--rojo); color: var(--blanco); }

  .grid-menu {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .tarjeta {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 16px;
    box-shadow: var(--sombra);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform .15s;
  }
  .tarjeta:hover { transform: translateY(-3px); }
  .tarjeta .emoji { font-size: 40px; }
  .tarjeta h3 { font-size: 18px; }
  .tarjeta .desc { color: var(--gris); font-size: 13.5px; flex: 1; }
  .tarjeta .pie {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }
  .precio { font-weight: 800; font-size: 18px; color: var(--rojo); }
  .btn-agregar {
    background: var(--amarillo);
    border: none;
    color: var(--carbon);
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 10px;
    transition: .15s;
  }
  .btn-agregar:hover { background: #ffb800; }
  .btn-agregar:active { transform: scale(.96); }

  /* ---------- Panel del pedido ---------- */
  .panel {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 18px;
  }
  .panel h2 {
    font-size: 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vacio {
    text-align: center;
    color: var(--gris);
    padding: 20px 8px;
    border: 2px dashed var(--borde);
    border-radius: 12px;
    font-size: 14px;
  }
  .linea {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--borde);
    align-items: center;
  }
  .linea .nombre { font-weight: 600; font-size: 15px; }
  .linea .sub { font-weight: 700; text-align: right; }
  .cantidad {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .cantidad button {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--borde);
    background: var(--crema);
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
  }
  .cantidad button:hover { background: var(--amarillo); }
  .cantidad span { min-width: 18px; text-align: center; font-weight: 700; }
  .quitar {
    background: none; border: none; color: var(--rojo);
    font-size: 13px; text-decoration: underline; justify-self: end;
  }

  .total {
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    font-weight: 800;
    padding: 14px 0 6px;
  }
  .total span:last-child { color: var(--rojo); }

  /* ---------- Formulario ---------- */
  form { margin-top: 12px; display: grid; gap: 12px; }
  label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 4px; }
  .fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input[type="text"], input[type="tel"], input[type="date"], input[type="time"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--borde);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    background: var(--blanco);
    color: var(--carbon);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--rojo);
  }
  textarea { resize: vertical; min-height: 64px; }
  .tipos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tipos input { position: absolute; opacity: 0; pointer-events: none; }
  .tipos label {
    margin: 0;
    text-align: center;
    padding: 10px 4px;
    border: 2px solid var(--borde);
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: .15s;
  }
  .tipos input:checked + label {
    background: var(--rojo);
    border-color: var(--rojo);
    color: var(--blanco);
  }
  .tipos input:focus-visible + label { outline: 3px solid var(--amarillo); }
  .oculto { display: none !important; }

  .btn-confirmar {
    background: var(--rojo);
    color: var(--blanco);
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .3px;
    transition: .15s;
  }
  .btn-confirmar:hover { background: var(--rojo-oscuro); }
  .btn-limpiar {
    background: none;
    border: none;
    color: var(--gris);
    font-size: 13px;
    text-decoration: underline;
  }
  .error {
    background: #fdecea;
    color: #9b1c1c;
    border: 1px solid #f5c2c0;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
  }

  /* ---------- Barra móvil ---------- */
  .barra-movil {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--carbon);
    color: var(--blanco);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    z-index: 20;
    box-shadow: 0 -4px 14px rgba(0,0,0,.25);
  }
  .barra-movil button {
    background: var(--amarillo);
    color: var(--carbon);
    border: none;
    font-weight: 800;
    padding: 10px 18px;
    border-radius: 10px;
  }

  /* ---------- Ticket (modal) ---------- */
  .fondo-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal {
    background: var(--blanco);
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 22px;
    text-align: center;
  }
  .modal .check { font-size: 44px; }
  .modal h2 { color: var(--verde); margin: 4px 0 2px; }
  .ticket {
    background: var(--crema);
    border: 2px dashed var(--borde);
    border-radius: 10px;
    padding: 14px;
    margin: 14px 0;
    text-align: left;
    font-family: "Courier New", monospace;
    font-size: 13.5px;
    white-space: pre-wrap;
  }
  .acciones { display: grid; gap: 8px; }
  .acciones button, .acciones a {
    padding: 12px;
    border-radius: 10px;
    border: 2px solid var(--borde);
    background: var(--blanco);
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    color: var(--carbon);
    text-align: center;
  }
  .acciones .principal { background: var(--rojo); border-color: var(--rojo); color: var(--blanco); }
  .acciones .whatsapp { background: #25d366; border-color: #25d366; color: var(--blanco); }

  footer {
    text-align: center;
    color: var(--gris);
    font-size: 13px;
    padding: 0 12px 90px;
  }

  @media print {
    body * { visibility: hidden; }
    .ticket, .ticket * { visibility: visible; }
    .ticket { position: absolute; left: 0; top: 0; width: 100%; border: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🍔</div>
  <h1>Zurich <span>Burguer</span></h1>
  <p>Toma de encargos · Hamburguesas hechas al momento</p>
</header>

<main class="contenedor">

  <!-- MENÚ -->
  <section aria-label="Menú">
    <div class="categorias" id="categorias"></div>
    <div class="grid-menu" id="menu"></div>
  </section>

  <!-- PEDIDO -->
  <aside class="panel" id="panel-pedido" aria-label="Pedido actual">
    <h2>🧾 Encargo actual</h2>

    <div id="lineas"></div>

    <div class="total">
      <span>Total</span>
      <span id="total">$0</span>
    </div>

    <form id="form-pedido" novalidate>
      <div>
        <label for="cliente">Nombre del cliente</label>
        <input type="text" id="cliente" placeholder="Ej: Carlos Gómez" autocomplete="off">
      </div>

      <div>
        <label>Tipo de pedido</label>
        <div class="tipos">
          <div>
            <input type="radio" name="tipo" id="t-llevar" value="Recoger en el local" checked>
            <label for="t-llevar">🛍️ Recoger en el local</label>
          </div>
          <div>
            <input type="radio" name="tipo" id="t-domicilio" value="Domicilio">
            <label for="t-domicilio">🛵 Domicilio</label>
          </div>
        </div>
      </div>

      <div>
        <label for="telefono">Teléfono de contacto</label>
        <input type="tel" id="telefono" placeholder="300 000 0000" inputmode="tel">
      </div>

      <div class="fila-2">
        <div>
          <label for="fecha">Fecha de entrega</label>
          <input type="date" id="fecha">
        </div>
        <div>
          <label for="hora">Hora</label>
          <input type="time" id="hora">
        </div>
      </div>

      <div id="campo-domicilio" class="oculto">
        <label for="direccion">Dirección de entrega</label>
        <input type="text" id="direccion" placeholder="Calle, número, barrio" autocomplete="off">
      </div>

      <div>
        <label for="pago">Método de pago</label>
        <select id="pago">
          <option>Efectivo</option>
          <option>Tarjeta</option>
          <option>Transferencia</option>
        </select>
      </div>

      <div>
        <label for="notas">Notas del pedido</label>
        <textarea id="notas" placeholder="Ej: sin cebolla, salsa aparte..."></textarea>
      </div>

      <div id="error" class="error oculto" role="alert"></div>

      <button type="submit" class="btn-confirmar">Confirmar encargo</button>
      <button type="button" class="btn-limpiar" id="btn-vaciar">Vaciar encargo</button>
    </form>
  </aside>
</main>

<footer>Zurich Burguer · ¡Gracias por tu pedido! 🍔</footer>

<!-- Barra inferior en móvil -->
<div class="barra-movil" id="barra-movil">
  <div><strong id="mov-cantidad">0</strong> productos · <strong id="mov-total">$0</strong></div>
  <button type="button" id="btn-ver-pedido">Ver pedido</button>
</div>

<!-- Ticket -->
<div class="fondo-modal oculto" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="check">✅</div>
    <h2 id="modal-titulo">¡Encargo registrado!</h2>
    <p id="modal-sub" style="color:var(--gris);font-size:14px">Guarda este ticket para preparar el encargo a tiempo.</p>
    <div class="ticket" id="ticket"></div>
    <div class="acciones">
      <a id="btn-whatsapp" class="whatsapp oculto" target="_blank" rel="noopener">Enviar por WhatsApp</a>
      <button type="button" id="btn-copiar">Copiar ticket</button>
      <button type="button" id="btn-imprimir">Imprimir</button>
      <button type="button" class="principal" id="btn-nuevo">Nuevo pedido</button>
    </div>
  </div>
</div>

<script>
  /* ====== CONFIGURACIÓN ======
     Si quieres que el pedido se pueda enviar por WhatsApp,
     escribe el número con código de país, sin espacios ni signos.
     Ejemplo Colombia: "573001234567". Déjalo vacío para ocultar el botón. */
  const WHATSAPP = "573108243216";

  /* ====== MENÚ (edita nombres y precios aquí) ====== */
  const PRODUCTOS = [
    { id: 1,  cat: "Hamburguesas", emoji: "🍔", nombre: "Zurich Clásica",   desc: "Carne 150 g, lechuga, tomate, queso y salsa de la casa.", precio: 16000 },
    { id: 2,  cat: "Hamburguesas", emoji: "⭐", nombre: "Zurich Especial",  desc: "La especial de la casa, con todo el sabor de Zurich.",     precio: 20000 },
  ];

  const CATEGORIAS = ["Todo"]; // Solo hamburguesas: la barra de categorías se oculta

  /* ====== ESTADO ====== */
  let carrito = {};        // { idProducto: cantidad }
  let categoriaActual = "Todo";
  let ultimoTicket = "";

  const $ = (id) => document.getElementById(id);
  const moneda = (n) => "$" + n.toLocaleString("es-CO");

  /* ====== RENDER MENÚ ====== */
  function renderCategorias() {
    if (CATEGORIAS.length <= 1) { $("categorias").classList.add("oculto"); return; }
    $("categorias").innerHTML = CATEGORIAS.map(c =>
      `<button type="button" class="cat-btn ${c === categoriaActual ? "activa" : ""}" data-cat="${c}">${c}</button>`
    ).join("");
  }

  function renderMenu() {
    const lista = PRODUCTOS.filter(p => categoriaActual === "Todo" || p.cat === categoriaActual);
    $("menu").innerHTML = lista.map(p => `
      <article class="tarjeta">
        <div class="emoji">${p.emoji}</div>
        <h3>${p.nombre}</h3>
        <p class="desc">${p.desc}</p>
        <div class="pie">
          <span class="precio">${moneda(p.precio)}</span>
          <button type="button" class="btn-agregar" data-add="${p.id}">+ Agregar</button>
        </div>
      </article>
    `).join("");
  }

  /* ====== RENDER PEDIDO ====== */
  function totales() {
    let total = 0, cantidad = 0;
    for (const id in carrito) {
      const p = PRODUCTOS.find(x => x.id == id);
      total += p.precio * carrito[id];
      cantidad += carrito[id];
    }
    return { total, cantidad };
  }

  function renderPedido() {
    const ids = Object.keys(carrito);
    if (ids.length === 0) {
      $("lineas").innerHTML = `<div class="vacio">Aún no has agregado productos.<br>Toca “+ Agregar” en el menú.</div>`;
    } else {
      $("lineas").innerHTML = ids.map(id => {
        const p = PRODUCTOS.find(x => x.id == id);
        const q = carrito[id];
        return `
          <div class="linea">
            <div class="nombre">${p.emoji} ${p.nombre}</div>
            <div class="sub">${moneda(p.precio * q)}</div>
            <div class="cantidad">
              <button type="button" data-menos="${id}" aria-label="Quitar uno">−</button>
              <span>${q}</span>
              <button type="button" data-mas="${id}" aria-label="Agregar uno">+</button>
            </div>
            <button type="button" class="quitar" data-quitar="${id}">Quitar</button>
          </div>`;
      }).join("");
    }
    const { total, cantidad } = totales();
    $("total").textContent = moneda(total);
    $("mov-total").textContent = moneda(total);
    $("mov-cantidad").textContent = cantidad;
  }

  /* ====== ACCIONES ====== */
  function agregar(id) { carrito[id] = (carrito[id] || 0) + 1; renderPedido(); }
  function restar(id) {
    if (!carrito[id]) return;
    carrito[id]--;
    if (carrito[id] <= 0) delete carrito[id];
    renderPedido();
  }
  function quitar(id) { delete carrito[id]; renderPedido(); }

  function mostrarError(msg) {
    const e = $("error");
    e.textContent = msg;
    e.classList.remove("oculto");
  }
  function ocultarError() { $("error").classList.add("oculto"); }

  function hoyISO() {
    const h = new Date();
    return h.getFullYear() + "-" + String(h.getMonth() + 1).padStart(2, "0") + "-" + String(h.getDate()).padStart(2, "0");
  }

  function siguienteNumero() {
    let n = 1;
    try {
      n = (parseInt(localStorage.getItem("zb_pedido") || "0", 10) || 0) + 1;
      localStorage.setItem("zb_pedido", String(n));
    } catch (e) { n = Math.floor(Date.now() / 1000) % 1000; }
    return n;
  }

  function construirTicket(numero) {
    const tipo = document.querySelector('input[name="tipo"]:checked').value;
    const fecha = new Date().toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" });
    let t = "ZURICH BURGUER\n";
    t += "Encargo #" + String(numero).padStart(3, "0") + "\n" + fecha + "\n";
    t += "--------------------------\n";
    t += "Cliente: " + $("cliente").value.trim() + "\n";
    t += "Tipo: " + tipo + "\n";
    t += "Teléfono: " + $("telefono").value.trim() + "\n";
    const [a, m, d] = $("fecha").value.split("-");
    t += "Entrega: " + d + "/" + m + "/" + a + " a las " + $("hora").value + "\n";
    if (tipo === "Domicilio") t += "Dirección: " + $("direccion").value.trim() + "\n";
    t += "Pago: " + $("pago").value + "\n";
    t += "--------------------------\n";
    for (const id in carrito) {
      const p = PRODUCTOS.find(x => x.id == id);
      t += carrito[id] + " x " + p.nombre + "  " + moneda(p.precio * carrito[id]) + "\n";
    }
    t += "--------------------------\n";
    t += "TOTAL: " + moneda(totales().total) + "\n";
    const notas = $("notas").value.trim();
    if (notas) t += "\nNotas: " + notas + "\n";
    return t;
  }

  function validar() {
    if (Object.keys(carrito).length === 0) return "Agrega al menos un producto al pedido.";
    if (!$("cliente").value.trim()) return "Escribe el nombre del cliente.";
    const tipo = document.querySelector('input[name="tipo"]:checked').value;
    if (!$("telefono").value.trim()) return "Escribe un teléfono de contacto.";
    if (!$("fecha").value) return "Indica la fecha de entrega.";
    if ($("fecha").value < hoyISO()) return "La fecha de entrega no puede ser anterior a hoy.";
    if (!$("hora").value) return "Indica la hora de entrega.";
    if (tipo === "Domicilio" && !$("direccion").value.trim()) return "Escribe la dirección de entrega.";
    return "";
  }

  function limpiarTodo() {
    carrito = {};
    $("form-pedido").reset();
    actualizarCamposTipo();
    ocultarError();
    renderPedido();
  }

  function actualizarCamposTipo() {
    const tipo = document.querySelector('input[name="tipo"]:checked').value;
    $("campo-domicilio").classList.toggle("oculto", tipo !== "Domicilio");
  }

  /* ====== EVENTOS ====== */
  $("categorias").addEventListener("click", (e) => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    categoriaActual = b.dataset.cat;
    renderCategorias();
    renderMenu();
  });

  $("menu").addEventListener("click", (e) => {
    const b = e.target.closest("[data-add]");
    if (b) agregar(b.dataset.add);
  });

  $("lineas").addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.mas) agregar(t.dataset.mas);
    if (t.dataset.menos) restar(t.dataset.menos);
    if (t.dataset.quitar) quitar(t.dataset.quitar);
  });

  document.querySelectorAll('input[name="tipo"]').forEach(r =>
    r.addEventListener("change", actualizarCamposTipo));

  $("btn-vaciar").addEventListener("click", () => {
    if (Object.keys(carrito).length === 0 || confirm("¿Vaciar todo el pedido?")) limpiarTodo();
  });

  $("btn-ver-pedido").addEventListener("click", () => {
    $("panel-pedido").scrollIntoView({ behavior: "smooth" });
  });

  $("form-pedido").addEventListener("submit", (e) => {
    e.preventDefault();
    const msg = validar();
    if (msg) { mostrarError(msg); return; }
    ocultarError();

    const numero = siguienteNumero();
    ultimoTicket = construirTicket(numero);
    $("ticket").textContent = ultimoTicket;

    const w = $("btn-whatsapp");
    const sub = $("modal-sub");
    let urlWhatsapp = "";
    if (WHATSAPP) {
      const mensaje = "Hola Zurich Burguer 🍔, quiero hacer este encargo:\n\n" + ultimoTicket;
      urlWhatsapp = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(mensaje);
      w.href = urlWhatsapp;
      w.textContent = "Abrir WhatsApp de nuevo";
      w.classList.remove("oculto");
      sub.textContent = "Se abrió WhatsApp con tu encargo. Solo falta presionar “Enviar”.";
    } else {
      w.classList.add("oculto");
      sub.textContent = "Guarda este ticket para preparar el encargo a tiempo.";
    }
    $("modal").classList.remove("oculto");

    // Abre WhatsApp automáticamente con el mensaje ya escrito
    if (urlWhatsapp) window.open(urlWhatsapp, "_blank", "noopener");
  });

  $("btn-copiar").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(ultimoTicket);
      $("btn-copiar").textContent = "¡Copiado!";
    } catch (err) {
      $("btn-copiar").textContent = "No se pudo copiar";
    }
    setTimeout(() => $("btn-copiar").textContent = "Copiar ticket", 1800);
  });

  $("btn-imprimir").addEventListener("click", () => window.print());

  $("btn-nuevo").addEventListener("click", () => {
    $("modal").classList.add("oculto");
    limpiarTodo();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* ====== INICIO ====== */
  $("fecha").min = hoyISO();
  renderCategorias();
  renderMenu();
  renderPedido();
  actualizarCamposTipo();
</script>
</body>
</html>
